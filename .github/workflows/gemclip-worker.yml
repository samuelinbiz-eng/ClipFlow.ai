name: GemClip video worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemclip-video-worker
  cancel-in-progress: false

jobs:
  process-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GEMCLIP_API_URL: ${{ secrets.GEMCLIP_API_URL }}
      GEMCLIP_WORKER_SECRET: ${{ secrets.GEMCLIP_WORKER_SECRET }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      WHISPER_MODEL: tiny
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/worker-requirements.txt
      - name: Check worker secrets
        run: |
          test -n "$GEMCLIP_API_URL" || (echo "Missing GEMCLIP_API_URL secret" && exit 1)
          test -n "$GEMCLIP_WORKER_SECRET" || (echo "Missing GEMCLIP_WORKER_SECRET secret" && exit 1)
          test -n "$BLOB_READ_WRITE_TOKEN" || (echo "Missing BLOB_READ_WRITE_TOKEN secret" && exit 1)
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install worker dependencies
        run: python -m pip install -r backend/worker-requirements.txt
      - name: Process queued videos
        run: python -m backend.worker
