services:
  - type: web
    name: gemclip-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: gemclip-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: CREDITS_DATABASE_PATH
        value: /var/data/credits.sqlite3
      - key: MEDIA_STORAGE_PATH
        value: /var/data/media
      - key: FIREBASE_PROJECT_ID
        value: clipflow-ai-bba29
      - key: CORS_ORIGINS
        value: https://gemclip.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: GROQ_API_KEY
        sync: false
      - key: PAYPAL_ENVIRONMENT
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_PLAN_ID
        sync: false
